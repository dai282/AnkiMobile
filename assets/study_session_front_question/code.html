<script>
  function handleRate(ease) {
    const toast = document.getElementById('toast');
    if (!toast) return;
    const labels = {
      again: 'Card rescheduled in <1 minute',
      hard: 'Card rescheduled in 12 minutes',
      good: 'Well done! Due in 1 day',
      easy: 'Excellent! Promoted to 4 days'
    };
    toast.textContent = labels[ease] || 'Interval saved';
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 1200);
  }

  const starBtn = document.getElementById('star-btn');
  if (starBtn) {
    starBtn.addEventListener('click', () => {
      const icon = starBtn.querySelector('.material-symbols-outlined');
      const isFilled = icon.style.fontVariationSettings?.includes("'FILL' 1");
      icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
      starBtn.classList.toggle('text-tertiary', !isFilled);
    });
  }

  const flagBtn = document.getElementById('flag-btn');
  if (flagBtn) {
    flagBtn.addEventListener('click', () => {
      const icon = flagBtn.querySelector('.material-symbols-outlined');
      const isFilled = icon.style.fontVariationSettings?.includes("'FILL' 1");
      icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
      flagBtn.classList.toggle('text-error', !isFilled);
    });
  }

  const audioBtn = document.getElementById('audio-btn');
  if (audioBtn) {
    audioBtn.addEventListener('click', () => {
      audioBtn.classList.add('scale-125', 'text-primary');
      setTimeout(() => {
        audioBtn.classList.remove('scale-125');
      }, 300);
    });
  }
</script></main>
